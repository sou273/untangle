<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Untangle 構成図</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho:wght@700&display=swap">
<style>
  html,body{margin:0;background:#ffffff}
  svg{display:block;font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif}
  .t{font-size:17px;fill:#1b2230}
  .s{font-size:13.5px;fill:#5d6878}
  .h{font-size:19px;font-weight:700;fill:#1b2230}
  .title{font-family:"Shippori Mincho",serif;font-size:34px;font-weight:700;fill:#1b2230}
  .w{font-size:15px;font-weight:700;fill:#ffffff}
  .lab{font-size:13px;fill:#1f4f96;font-weight:700}
  .lab2{font-size:13px;fill:#6a4bb0;font-weight:700}
  .lab3{font-size:13px;fill:#1e7a4f;font-weight:700}
  .step{font-size:17px;font-weight:700;fill:#1f4f96}
</style>
</head>
<body>
<svg width="1600" height="1040" viewBox="0 0 1600 1040" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f4f96"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6a4bb0"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e7a4f"/></marker>
  </defs>
  <rect width="1600" height="1040" fill="#ffffff"/>
  <text x="40" y="58" class="title">Untangle 構成図</text>
  <text x="40" y="88" class="s" style="font-size:16px">スタッフが過去に送ったメールから、ひな形に書き足された判断を全部取り出し、決裁者が決まりにして業務を譲渡する。生のメールはブラウザの外に出さない。</text>

  <!-- 左: 店のブラウザ -->
  <rect x="40" y="120" width="480" height="640" rx="20" fill="#f7f5fc" stroke="#6a4bb0" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="60" y="148" class="lab2">決裁者のパソコンのブラウザ — 生のメールが通るのはこの中だけ</text>

  <rect x="60" y="165" width="440" height="70" rx="12" fill="#ffffff" stroke="#d6dce5"/>
  <text x="76" y="193" class="h">Gmail の送ったメール</text>
  <text x="76" y="218" class="s">読み取りのみ（gmail.readonly）。審査用は架空の店の98通</text>

  <rect x="60" y="250" width="440" height="115" rx="12" fill="#ffffff" stroke="#d6dce5"/>
  <text x="76" y="278" class="h">① ひな形からの外れを取り出す</text>
  <text x="76" y="303" class="t">同じ行が何通にも出る部分＝ひな形として外し、</text>
  <text x="76" y="326" class="t">スタッフが書き足した文だけを残す</text>
  <text x="76" y="350" class="s">自動送信のメールと、お礼・承知だけの返事も外す</text>

  <rect x="60" y="380" width="440" height="170" rx="12" fill="#ffffff" stroke="#d6dce5"/>
  <text x="76" y="408" class="h">② 名前や番号を伏せる（AIを使わない）</text>
  <text x="76" y="434" class="t">・電話・メール・住所・宛名・会社名の語尾</text>
  <text x="76" y="458" class="t">・署名から集めたスタッフ名 → 「スタッフA」</text>
  <text x="76" y="482" class="t">・日本語の辞書（kuromoji、裏の Web Worker）で</text>
  <text x="76" y="506" class="t">　固有名詞と辞書に無い語</text>
  <text x="76" y="530" class="t">・「様」の前は、名前でないと分かる語以外すべて</text>

  <rect x="60" y="565" width="440" height="70" rx="12" fill="#ffffff" stroke="#d6dce5"/>
  <text x="76" y="593" class="h">③ 伏せ残りの疑いがある行は送らない</text>
  <text x="76" y="617" class="s">確かめる画面は無い。疑わしければ送らない側に倒す</text>

  <rect x="60" y="650" width="440" height="105" rx="12" fill="#e3ebf7" stroke="#1f4f96"/>
  <text x="76" y="676" class="h" style="fill:#1f4f96">決裁者（ダッシュボード）</text>
  <text x="76" y="702" class="t">分類を確認する → 判断を確認する →</text>
  <text x="76" y="726" class="t">例外を確認する → マニュアルを渡す</text>
  <text x="76" y="744" class="s">決まりを確定・片付けできるのは決裁者だけ</text>

  <path d="M280,235 L280,250" stroke="#6a4bb0" stroke-width="2" marker-end="url(#p)"/>
  <path d="M280,365 L280,380" stroke="#6a4bb0" stroke-width="2" marker-end="url(#p)"/>
  <path d="M280,550 L280,565" stroke="#6a4bb0" stroke-width="2" marker-end="url(#p)"/>

  <!-- 中央: Cloud Run -->
  <rect x="600" y="120" width="520" height="640" rx="16" fill="#ffffff" stroke="#1f4f96" stroke-width="2"/>
  <rect x="600" y="120" width="520" height="40" rx="16" fill="#1f4f96"/>
  <rect x="600" y="140" width="520" height="20" fill="#1f4f96"/>
  <text x="620" y="147" class="w">Cloud Run「untangle」（東京）画面・API・エージェント</text>

  <rect x="620" y="175" width="480" height="100" rx="12" fill="#f5f7fa" stroke="#d6dce5"/>
  <text x="636" y="203" class="h">④ もう一度検査する</text>
  <text x="636" y="229" class="t">決まった規則で伏せ直して1字でも変われば、</text>
  <text x="636" y="253" class="t">その文は Gemini に渡さない。受け取った文は保存しない</text>

  <rect x="620" y="290" width="480" height="150" rx="12" fill="#f5f7fa" stroke="#d6dce5"/>
  <text x="636" y="318" class="h">⑤ 条文エンジン（AIを使わない）</text>
  <text x="636" y="344" class="t">決裁者が選んだ答えを条文にし、過去の実例に</text>
  <text x="636" y="368" class="t">当て直して、決まりと違う答え方を数える</text>
  <text x="636" y="392" class="t">片付け: 「これからは決まりどおり」か「例外の条件」</text>
  <text x="636" y="420" class="s">違いが残っていなければ完了 → 規程の版を出す</text>

  <rect x="620" y="455" width="480" height="160" rx="12" fill="#f5f7fa" stroke="#d6dce5"/>
  <text x="636" y="483" class="h">⑥ 巡回エージェント（ADK）</text>
  <text x="636" y="509" class="t">持たせる道具: テーマの状態を読む・</text>
  <text x="636" y="533" class="t">譲渡までのやることを洗い出す・メモを書く</text>
  <text x="636" y="557" class="t">持たせない道具: 決まりの確定・変更、片付け</text>
  <text x="636" y="583" class="s">呼んだ道具はすべて画面に出す。Gemini が混んでいれば</text>
  <text x="636" y="602" class="s">待ってやり直し、だめなら同じ手順を決まったプログラムで</text>

  <rect x="620" y="630" width="480" height="115" rx="12" fill="#e1f2e9" stroke="#1e7a4f"/>
  <text x="636" y="658" class="h" style="fill:#1e7a4f">⑦ 出口: スタッフ向けマニュアル</text>
  <text x="636" y="684" class="t">完了したテーマの決まり・理由・例外を1つに。</text>
  <text x="636" y="708" class="t">全テーマが完了すると「業務を譲渡できます」</text>
  <text x="636" y="732" class="s">費用の歯止め: 接続元ごと・全体の回数制限、本文1MB</text>

  <!-- ブラウザ ⇄ Cloud Run -->
  <path d="M500,600 L620,240" stroke="#6a4bb0" stroke-width="2" marker-end="url(#p)"/>
  <text x="530" y="300" class="lab2">伏せた</text>
  <text x="530" y="316" class="lab2">文だけ</text>
  <path d="M600,720 L500,720" stroke="#1f4f96" stroke-width="2" marker-end="url(#a)"/>
  <path d="M500,690 L620,370" stroke="#1f4f96" stroke-width="2" marker-end="url(#a)"/>
  <text x="560" y="596" class="lab">選んだ</text>
  <text x="560" y="612" class="lab">答え</text>
  <text x="524" y="740" class="lab">やること</text>
  <text x="524" y="756" class="lab">・メモ</text>

  <!-- 右: Vertex AI -->
  <rect x="1200" y="120" width="360" height="370" rx="16" fill="#ffffff" stroke="#1f4f96" stroke-width="2"/>
  <rect x="1200" y="120" width="360" height="40" rx="16" fill="#1f4f96"/>
  <rect x="1200" y="140" width="360" height="20" fill="#1f4f96"/>
  <text x="1220" y="147" class="w">Vertex AI　Gemini 3.5 Flash（東京）</text>
  <text x="1220" y="190" class="s">伏せた後の文だけを受け取る</text>
  <text x="1220" y="226" class="h">判断のテーマに分ける</text>
  <text x="1220" y="250" class="s">書き足しの文を、同じ判断ごとのテーマに。</text>
  <text x="1220" y="268" class="s">判断の無い文は外す</text>
  <text x="1220" y="306" class="h">決めることを並べる</text>
  <text x="1220" y="330" class="s">実例に出た答え方を選択肢にして、</text>
  <text x="1220" y="348" class="s">どの実例がどの答えかを付ける</text>
  <text x="1220" y="386" class="h">巡回エージェントのモデル</text>
  <text x="1220" y="410" class="s">状態の読み取りと、テーマごとのメモの言い回し</text>
  <text x="1220" y="452" class="s">用途ごとに考える量（思考トークン）を絞る</text>

  <path d="M1100,212 L1200,212" stroke="#6a4bb0" stroke-width="2" marker-end="url(#p)"/>
  <path d="M1200,250 L1100,250" stroke="#1f4f96" stroke-width="2" marker-end="url(#a)"/>
  <text x="1112" y="204" class="lab2">伏せた文</text>
  <text x="1112" y="270" class="lab">テーマ</text>
  <path d="M1100,520 L1200,420" stroke="#1f4f96" stroke-width="2" marker-end="url(#a)"/>

  <!-- 右下: 譲渡した先 -->
  <rect x="1200" y="530" width="360" height="230" rx="16" fill="#e1f2e9" stroke="#1e7a4f" stroke-width="2"/>
  <text x="1220" y="562" class="h" style="fill:#1e7a4f">譲渡した先</text>
  <text x="1220" y="592" class="t">スタッフ: マニュアルどおりに答える</text>
  <text x="1220" y="618" class="t">AI: マニュアルを指示として使う</text>
  <text x="1220" y="644" class="t">決裁者: 決まりに無い場面だけ見る</text>
  <text x="1220" y="680" class="s">判断は過去のメールに出たものを</text>
  <text x="1220" y="698" class="s">全部確かめてあるので、決まりと違う</text>
  <text x="1220" y="716" class="s">答え方が残ったまま渡すことは無い</text>
  <path d="M1100,688 L1200,688" stroke="#1e7a4f" stroke-width="2" marker-end="url(#g)"/>

  <!-- 下: 決裁者の4段 -->
  <rect x="40" y="790" width="1520" height="225" rx="16" fill="#f5f7fa" stroke="#d6dce5"/>
  <text x="60" y="822" class="h">決裁者がやること — 過去のメールを全部読み込んだ時点で、テーマは全部出ている</text>

  <rect x="60" y="842" width="270" height="88" rx="12" fill="#ffffff" stroke="#1f4f96"/>
  <text x="78" y="870" class="step">1. 分類を確認する</text>
  <text x="78" y="895" class="s">実例を見て、同じ判断の</text>
  <text x="78" y="913" class="s">まとまりになっているか</text>
  <path d="M330,886 L360,886" stroke="#1f4f96" stroke-width="2" marker-end="url(#a)"/>
  <rect x="362" y="842" width="270" height="88" rx="12" fill="#ffffff" stroke="#1f4f96"/>
  <text x="380" y="870" class="step">2. 判断を確認する</text>
  <text x="380" y="895" class="s">スタッフの答え方から1つ選ぶ。</text>
  <text x="380" y="913" class="s">いま決めないなら「あとで決める」</text>
  <path d="M632,886 L662,886" stroke="#1f4f96" stroke-width="2" marker-end="url(#a)"/>
  <rect x="664" y="842" width="270" height="88" rx="12" fill="#ffffff" stroke="#1f4f96"/>
  <text x="682" y="870" class="step">3. 例外を確認する</text>
  <text x="682" y="895" class="s">決まりと違っていた過去の返事を</text>
  <text x="682" y="913" class="s">「決まりどおり」か「例外」に</text>
  <path d="M934,886 L964,886" stroke="#1f4f96" stroke-width="2" marker-end="url(#a)"/>
  <rect x="966" y="842" width="270" height="88" rx="12" fill="#e1f2e9" stroke="#1e7a4f"/>
  <text x="984" y="870" class="step" style="fill:#1e7a4f">4. 完了</text>
  <text x="984" y="895" class="s">マニュアルができる。</text>
  <text x="984" y="913" class="s">スタッフへの知らせもコピーできる</text>
  <path d="M1236,886 L1266,886" stroke="#1e7a4f" stroke-width="2" marker-end="url(#g)"/>
  <rect x="1268" y="842" width="272" height="88" rx="12" fill="#1e7a4f"/>
  <text x="1286" y="878" class="w" style="font-size:18px">全テーマ完了で</text>
  <text x="1286" y="906" class="w" style="font-size:18px">業務を譲渡できます</text>

  <text x="60" y="962" class="t">固く渡す: 伏せるのも、条文を当て直して違いを数えるのも、完了の判定も、決まったプログラム。AI に任せるのは分ける・並べる・メモを書くことだけ。</text>
  <text x="60" y="990" class="t">決まりを確定する道具・片付ける道具はエージェントに渡していない（テストで固定）。決めるのは決裁者で、エージェントは譲渡までの道筋を示す。</text>
</svg>
</body>
</html>
