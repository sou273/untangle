<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Untangle 構成図</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho:wght@700&display=swap">
<style>
  html,body{margin:0;background:#ffffff}
  svg{display:block;font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif}
  .t{font-size:17px;fill:#1b2230}
  .s{font-size:13.5px;fill:#5d6878}
  .h{font-size:19px;font-weight:700;fill:#1b2230}
  .title{font-family:"Shippori Mincho",serif;font-size:34px;font-weight:700;fill:#1b2230}
  .w{font-size:15px;font-weight:700;fill:#ffffff}
  .lab{font-size:13px;fill:#1f4f96;font-weight:700}
  .lab2{font-size:13px;fill:#6a4bb0;font-weight:700}
</style>
</head>
<body>
<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f4f96"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6a4bb0"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e7a4f"/></marker>
  </defs>
  <rect width="1600" height="1000" fill="#ffffff"/>
  <text x="40" y="58" class="title">Untangle 構成図</text>
  <text x="40" y="88" class="s" style="font-size:16px">決裁者の判断を、テスト済みの規程として引き出す。生の文は自分のプロジェクトの外に出さず、外部のGeminiには伏せた後の文だけを渡す。</text>

  <!-- 左: 店 -->
  <rect x="40" y="130" width="250" height="600" rx="16" fill="#f5f7fa" stroke="#d6dce5"/>
  <text x="60" y="162" class="h">店（個人店・零細企業）</text>
  <rect x="60" y="185" width="210" height="96" rx="12" fill="#ffffff" stroke="#d6dce5"/>
  <text x="76" y="213" class="t">決裁者とスタッフの</text>
  <text x="76" y="236" class="t">やり取り</text>
  <text x="76" y="262" class="s">チャット・メール・一言メモ</text>
  <rect x="60" y="296" width="210" height="80" rx="12" fill="#ffffff" stroke="#d6dce5"/>
  <text x="76" y="324" class="t">業務の中で</text>
  <text x="76" y="347" class="t">人が直した跡</text>
  <text x="76" y="366" class="s">台帳の修正・承認</text>
  <rect x="60" y="391" width="210" height="62" rx="12" fill="#ffffff" stroke="#d6dce5"/>
  <text x="76" y="418" class="t">店の台帳</text>
  <text x="76" y="440" class="s">スタッフ名簿・取引先一覧</text>
  <rect x="60" y="520" width="210" height="190" rx="12" fill="#e3ebf7" stroke="#1f4f96"/>
  <text x="76" y="550" class="h" style="fill:#1f4f96">決裁者</text>
  <text x="76" y="578" class="t">質問に一言で答える</text>
  <text x="76" y="603" class="t">条文を確定する</text>
  <text x="76" y="628" class="t">完了の基準を決める</text>
  <text x="76" y="653" class="t">AIに見せる範囲を決める</text>
  <text x="76" y="690" class="s">確定できるのは決裁者だけ</text>

  <!-- 自分のプロジェクトの境界 -->
  <rect x="330" y="120" width="840" height="620" rx="20" fill="none" stroke="#6a4bb0" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="350" y="148" class="lab2">自分のGoogle Cloudプロジェクト（東京リージョン）— 生の文が通るのはこの中だけ</text>

  <!-- Cloud Run 本体 -->
  <rect x="350" y="165" width="560" height="555" rx="16" fill="#ffffff" stroke="#1f4f96" stroke-width="2"/>
  <rect x="350" y="165" width="560" height="40" rx="16" fill="#1f4f96"/>
  <rect x="350" y="185" width="560" height="20" fill="#1f4f96"/>
  <text x="370" y="192" class="w">Cloud Run「untangle」 画面・API・エージェント</text>

  <!-- 行1: 伏せる層・消し残しの検査 -->
  <rect x="370" y="220" width="255" height="124" rx="12" fill="#eee8f8" stroke="#6a4bb0"/>
  <text x="386" y="248" class="h" style="fill:#6a4bb0">① 伏せる層</text>
  <text x="386" y="274" class="t">店の台帳＋決まった規則</text>
  <text x="386" y="297" class="s">名前・電話・日付 → 属性へ</text>
  <text x="386" y="317" class="s">認証情報を含む文は取り込まない</text>
  <text x="386" y="336" class="s">元の文は保存しない</text>
  <rect x="640" y="220" width="250" height="124" rx="12" fill="#eee8f8" stroke="#6a4bb0"/>
  <text x="656" y="248" class="h" style="fill:#6a4bb0">② 消し残しの検査</text>
  <text x="656" y="276" class="t">疑いがあれば保留</text>
  <text x="656" y="299" class="s">Geminiには渡さない</text>
  <text x="656" y="319" class="s">Gemmaが使えないときも渡さない</text>

  <!-- 行2: 条文エンジン -->
  <rect x="370" y="356" width="520" height="96" rx="12" fill="#f5f7fa" stroke="#d6dce5"/>
  <text x="386" y="383" class="h">④ 条文エンジン</text>
  <text x="530" y="383" class="s">決まったプログラム（AIを使わない）</text>
  <text x="386" y="409" class="t">条文を当てはめ、過去の場面でテストする</text>
  <text x="386" y="433" class="s">外れを3つに分けて数える・4つの確認で完了・いつ聞くかの判定</text>

  <!-- 行3: エージェント -->
  <rect x="370" y="464" width="520" height="140" rx="12" fill="#e3ebf7" stroke="#1f4f96"/>
  <text x="386" y="492" class="h" style="fill:#1f4f96">⑤ 引き継ぎエージェント（ADK）</text>
  <text x="386" y="515" class="s">記録が届くたびに巡回し、作業記録を残す</text>
  <text x="386" y="541" class="t">持たせる道具: 状態を見る・新しい場面を見る</text>
  <text x="386" y="563" class="t">・聞くべきことを探す・言い回しを整える・テストする</text>
  <text x="386" y="590" class="t" style="font-weight:700;fill:#b0342c">持たせない道具: 条文の確定・変更、質問への回答</text>

  <!-- 行4: 出口 -->
  <rect x="370" y="616" width="520" height="90" rx="12" fill="#e1f2e9" stroke="#1e7a4f"/>
  <text x="386" y="644" class="h" style="fill:#1e7a4f">⑥ 出口（テスト合格・確認済みの条文だけ）</text>
  <text x="386" y="670" class="t">スタッフ向けマニュアル／AIへの指示＋テスト一式</text>
  <text x="386" y="693" class="t">／自動化の仕様書</text>

  <!-- Gemma（行3の右） -->
  <rect x="935" y="464" width="215" height="196" rx="16" fill="#ffffff" stroke="#6a4bb0" stroke-width="2"/>
  <rect x="935" y="464" width="215" height="40" rx="16" fill="#6a4bb0"/>
  <rect x="935" y="484" width="215" height="20" fill="#6a4bb0"/>
  <text x="951" y="491" class="w">Cloud Run「gemma」</text>
  <text x="951" y="532" class="h">Gemma 3（4B）</text>
  <text x="951" y="555" class="s">CPUで動く公開モデル</text>
  <text x="951" y="583" class="t">台帳に無い</text>
  <text x="951" y="605" class="t">固有名詞を見つける</text>
  <text x="951" y="632" class="s">非公開。呼べるのは</text>
  <text x="951" y="650" class="s">本体のアカウントだけ</text>

  <!-- 外部: Gemini -->
  <rect x="1210" y="165" width="350" height="320" rx="16" fill="#ffffff" stroke="#1f4f96" stroke-width="2"/>
  <rect x="1210" y="165" width="350" height="40" rx="16" fill="#1f4f96"/>
  <rect x="1210" y="185" width="350" height="20" fill="#1f4f96"/>
  <text x="1230" y="192" class="w">Vertex AI　Gemini 3.5 Flash（東京）</text>
  <text x="1230" y="232" class="s">学習に使われない契約の上で、</text>
  <text x="1230" y="251" class="s">伏せた後の文だけを受け取る</text>
  <text x="1230" y="284" class="t">③ 場面の読み取り</text>
  <text x="1230" y="305" class="s">答えは問いの選択肢から選ばせる</text>
  <text x="1230" y="340" class="t">⑤ 質問の言い回し（エージェント）</text>
  <text x="1230" y="375" class="t">⑥ AIへの指示の「渡す前のテスト」</text>
  <text x="1230" y="396" class="s">規程だけを渡して同梱のテストを解かせ、</text>
  <text x="1230" y="415" class="s">正解はUntangleが数える</text>
  <text x="1230" y="446" class="s">実測: 130件中130件で正解・規程に無い</text>
  <text x="1230" y="465" class="s">場面2件中2件で「決裁者に回します」</text>

  <!-- 外部: 受け手 -->
  <rect x="1210" y="510" width="350" height="220" rx="16" fill="#f5f7fa" stroke="#d6dce5"/>
  <text x="1230" y="540" class="h">渡した先（使用者に委ねる）</text>
  <text x="1230" y="570" class="t">スタッフ: マニュアルで答える</text>
  <text x="1230" y="598" class="t">AI: テストに合格した指示だけ</text>
  <text x="1230" y="626" class="t">自動化: 判断表とテスト一式</text>
  <text x="1230" y="658" class="s">任せ方の段階: 見学 → 案を出す →</text>
  <text x="1230" y="678" class="s">事後確認 → 自動（直近N件で修正0なら次へ）</text>
  <text x="1230" y="708" class="s">規程が変われば作り直し、変わる件数を示す</text>

  <!-- 矢印 -->
  <text x="282" y="205" class="lab2">生の文</text>
  <path d="M270,233 L366,262" stroke="#6a4bb0" stroke-width="2.4" fill="none" marker-end="url(#p)"/>
  <path d="M270,336 L366,300" stroke="#6a4bb0" stroke-width="2.4" fill="none" marker-end="url(#p)"/>
  <path d="M270,422 L366,330" stroke="#6a4bb0" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#p)"/>
  <path d="M625,282 L636,282" stroke="#6a4bb0" stroke-width="2.4" fill="none" marker-end="url(#p)"/>
  <!-- ②⇔Gemma（エンジンの右の余白を通す） -->
  <path d="M890,330 C915,330 915,420 960,460" stroke="#6a4bb0" stroke-width="2" fill="none" marker-end="url(#p)"/>
  <path d="M1000,460 C1000,380 960,300 894,300" stroke="#6a4bb0" stroke-width="2" fill="none" marker-end="url(#p)"/>
  <text x="1012" y="410" class="lab2">名前の候補</text>
  <!-- ②→Gemini -->
  <path d="M890,250 L1206,250" stroke="#1f4f96" stroke-width="2.6" fill="none" marker-end="url(#a)"/>
  <text x="935" y="240" class="lab">伏せた後の文だけ</text>
  <!-- Gemini→エンジン（場面） -->
  <path d="M1206,300 C1120,300 1060,360 894,390" stroke="#1f4f96" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="1100" y="330" class="lab">場面</text>
  <!-- エンジン→エージェント -->
  <path d="M630,452 L630,460" stroke="#1f4f96" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <!-- 決裁者 -->
  <path d="M270,620 L366,560" stroke="#1f4f96" stroke-width="2.4" fill="none" marker-end="url(#a)"/>
  <path d="M366,585 L274,650" stroke="#1f4f96" stroke-width="2.4" fill="none" marker-end="url(#a)"/>
  <text x="282" y="586" class="lab">質問</text>
  <text x="282" y="672" class="lab">答え</text>
  <!-- 出口→渡した先 -->
  <path d="M890,690 C1000,700 1100,640 1206,620" stroke="#1e7a4f" stroke-width="2.6" fill="none" marker-end="url(#g)"/>

  <!-- 下: 固く渡すための6つの決まり -->
  <rect x="40" y="770" width="1520" height="200" rx="16" fill="#f5f7fa" stroke="#d6dce5"/>
  <text x="60" y="804" class="h">「固く渡す」— 決裁者が決めたルールに則ってテストし、問題がなければ渡す</text>
  <g class="t">
    <text x="60" y="842">データ: 伏せ方もテストに合格してから使う（消し漏れ0・消しすぎ0）</text>
    <text x="60" y="874">判断: いつ聞くかは決まったプログラム。エージェントは言い回しだけ</text>
    <text x="60" y="906">権限: 確定・回答の道具をエージェントに渡さない（テストで固定）</text>
    <text x="810" y="842">合否: 正解を数えるのはUntangle。AIに合否を言わせない</text>
    <text x="810" y="874">出口: AIは規程の選択肢からしか答えられない。規程外は決裁者へ</text>
    <text x="810" y="906">可観測性: 呼んだ道具・AIに渡した内容をすべて記録して画面に出す</text>
  </g>
  <text x="60" y="948" class="s">完了の4つの確認: 答えられない場面は残っていないか／答えはあなたと同じか／もう新しい話は出てこないか／あなたへの質問は残っていないか</text>
</svg>
</body>
</html>
